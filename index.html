<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volafly — Volatilität lesen. On the fly.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 24 C6 24 10 16 16 12 C22 16 26 24 30 24' stroke='%23F5F5F7' stroke-width='2.5' stroke-linecap='round' fill='none'/><path d='M2 18 C6 18 10 12 16 8 C22 12 26 18 30 18' stroke='%23F5F5F7' stroke-width='2' stroke-linecap='round' fill='none' opacity='0.5'/></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0A0A; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes volafly-pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="templates.js"></script>
<script type="text/babel">
    // ── Supabase ──────────────────────────────────────────────────────────
    // 👉 HIER deine Supabase-Werte eintragen:
    const SUPABASE_URL  = 'https://jiycewpqjcvjbykcxaqi.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppeWNld3BxamN2amJ5a2N4YXFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDg0NjgsImV4cCI6MjA4OTA4NDQ2OH0._QGScZNrJ0qJbnXFCpJzG5GC2ZufUWbAa_1i2sGJB5w';

    // ── Web3Forms Konfiguration ───────────────────────────────────────────
    // Setup: https://web3forms.com → E-Mail eingeben → Access Key kopieren
    const WEB3FORMS_KEY = '3dae9cac-34c7-4f42-8f22-e87a7662a890';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    // ─────────────────────────────────────────────────────────────────────

    const { useState, useEffect, useRef } = React;

    // ── Login Screen ──────────────────────────────────────────────────────
    const LoginScreen = ({ onLogin }) => {
      const [isMobile, setIsMobile] = React.useState(window.innerWidth < 700);
      React.useEffect(() => {
        const fn = () => setIsMobile(window.innerWidth < 700);
        window.addEventListener('resize', fn);
        return () => window.removeEventListener('resize', fn);
      }, []);
      const [mode, setMode]       = useState('login');
      const [email, setEmail]     = useState('');
      const [password, setPass]   = useState('');
      const [error, setError]     = useState('');
      const [loading, setLoading] = useState(false);
      const [resetSent, setResetSent] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setError(''); setLoading(true);
        try {
          let res;
          if (mode === 'login') {
            res = await sb.auth.signInWithPassword({ email, password });
          } else {
            res = await sb.auth.signUp({ email, password });
            if (!res.error && res.data.user && !res.data.session) {
              setError('Bestätigungsmail gesendet — bitte E-Mail prüfen.');
              setLoading(false); return;
            }
          }
          if (res.error) throw res.error;
          onLogin(res.data.user);
        } catch (err) {
          setError(err.message || 'Fehler bei der Anmeldung');
        }
        setLoading(false);
      };

      const handleReset = async () => {
        if (!email.trim()) { setError('Bitte zuerst E-Mail eingeben.'); return; }
        setLoading(true); setError('');
        const { error: e } = await sb.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: 'https://volafly.net',
        });
        setLoading(false);
        if (e) {
          const msg = e.message?.toLowerCase() || '';
          if (msg.includes('rate') || msg.includes('limit')) {
            setError('Zu viele Anfragen — bitte einige Minuten warten und erneut versuchen.');
          } else {
            setError(e.message);
          }
        } else { setResetSent(true); }
      };

      const features = [
        { icon: '◎', title: 'Echtzeit-Marktlage', desc: 'VIX, Credit Spreads, Fear & Greed und 20+ Indikatoren auf einen Blick' },
        { icon: '◈', title: 'Automatische Klassifikation', desc: '5 Volatilitätsstufen von Stille bis Panik — klare Handlungsempfehlung' },
        { icon: '◇', title: 'Antizyklisch investieren', desc: 'Investitionsgrade je nach Marktlage — datenbasiert, nicht emotional' },
      ];

      return (
        <div style={{
          minHeight: '100vh', display: 'flex',
          flexDirection: isMobile ? 'column' : 'row',
          alignItems: isMobile ? 'stretch' : 'center',
          justifyContent: isMobile ? 'flex-start' : 'center',
          background: '#0A0A0A',
          backgroundImage: 'radial-gradient(ellipse at 15% 40%, rgba(10,132,255,0.08) 0%, transparent 55%), radial-gradient(ellipse at 85% 20%, rgba(191,90,242,0.06) 0%, transparent 50%)',
          fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif',
          WebkitFontSmoothing: 'antialiased',
        }}>

          {/* ── Linke Seite: Marketing — auf Mobile ausgeblendet ── */}
          {!isMobile && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '60px 64px', maxWidth: '560px' }}>

            {/* Logo */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '56px' }}>
              <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
                <path d="M2 24 C6 24 10 16 16 12 C22 16 26 24 30 24" stroke="#F5F5F7" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
                <path d="M2 18 C6 18 10 12 16 8 C22 12 26 18 30 18" stroke="#F5F5F7" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.45"/>
              </svg>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                <span style={{ fontSize: '22px', fontWeight: 700, color: '#F5F5F7', letterSpacing: '-0.02em', lineHeight: 1 }}>Volafly</span>
                <span style={{ fontSize: '10px', color: 'rgba(255,255,255,0.3)', letterSpacing: '0.06em' }}>Volatilität lesen. On the fly.</span>
              </div>
            </div>

            {/* Headline */}
            <h1 style={{ fontSize: '40px', fontWeight: 700, color: '#F5F5F7', letterSpacing: '-0.03em', lineHeight: 1.15, margin: '0 0 16px' }}>
              Den Markt lesen,<br/>
              <span style={{ color: '#0A84FF' }}>bevor er spricht.</span>
            </h1>
            <p style={{ fontSize: '15px', color: 'rgba(255,255,255,0.45)', lineHeight: 1.65, margin: '0 0 48px', maxWidth: '400px' }}>
              Volafly aggregiert die wichtigsten Volatilitäts- und Sentiment-Indikatoren und übersetzt sie in eine klare Handlungsempfehlung — antizyklisch, datenbasiert, rational.
            </p>

            {/* Feature-Liste */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              {features.map((f, i) => (
                <div key={i} style={{ display: 'flex', gap: '16px', alignItems: 'flex-start' }}>
                  <div style={{ width: '32px', height: '32px', borderRadius: '8px', background: 'rgba(10,132,255,0.1)', border: '0.5px solid rgba(10,132,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', color: '#0A84FF', flexShrink: 0 }}>{f.icon}</div>
                  <div>
                    <div style={{ fontSize: '13px', fontWeight: 600, color: '#F5F5F7', marginBottom: '2px' }}>{f.title}</div>
                    <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)', lineHeight: 1.5 }}>{f.desc}</div>
                  </div>
                </div>
              ))}
            </div>

          </div>
          )}

          {/* ── Trennlinie — nur Desktop ── */}
          {!isMobile && <div style={{ width: '0.5px', background: 'rgba(255,255,255,0.06)', margin: '48px 0', flexShrink: 0 }} />}

          {/* ── Login-Form ── */}
          <div style={{
            flex: isMobile ? '1' : '0 0 420px',
            display: 'flex', flexDirection: 'column', justifyContent: 'center',
            padding: isMobile ? '48px 24px 40px' : '60px 48px',
          }}>

            {/* Mobile: Logo oben im Form-Bereich */}
            {isMobile && (
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '36px' }}>
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                  <path d="M2 24 C6 24 10 16 16 12 C22 16 26 24 30 24" stroke="#F5F5F7" strokeWidth="2.5" strokeLinecap="round" fill="none"/>
                  <path d="M2 18 C6 18 10 12 16 8 C22 12 26 18 30 18" stroke="#F5F5F7" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.45"/>
                </svg>
                <div>
                  <div style={{ fontSize: '18px', fontWeight: 700, color: '#F5F5F7', letterSpacing: '-0.02em', lineHeight: 1 }}>Volafly</div>
                  <div style={{ fontSize: '10px', color: 'rgba(255,255,255,0.3)', letterSpacing: '0.06em', marginTop: '3px' }}>Volatilität lesen. On the fly.</div>
                </div>
              </div>
            )}

            <div style={{ marginBottom: '32px' }}>
              <div style={{ fontSize: '22px', fontWeight: 700, color: '#F5F5F7', marginBottom: '6px' }}>
                {mode === 'login' ? 'Willkommen zurück' : 'Konto erstellen'}
              </div>
              <div style={{ fontSize: '13px', color: 'rgba(255,255,255,0.35)' }}>
                {mode === 'login' ? 'Meld dich an um loszulegen.' : 'Kostenlos, kein Abo nötig.'}
              </div>
            </div>

            {/* Tab toggle */}
            <div style={{ display: 'flex', background: 'rgba(255,255,255,0.05)', borderRadius: '12px', padding: '3px', marginBottom: '28px', border: '0.5px solid rgba(255,255,255,0.07)' }}>
              {['login','register'].map(m => (
                <button key={m} onClick={() => { setMode(m); setError(''); }}
                  style={{ flex: 1, padding: '8px', borderRadius: '10px', border: 'none', cursor: 'pointer', fontSize: '12px', fontWeight: 600,
                    background: mode === m ? 'rgba(255,255,255,0.12)' : 'transparent',
                    color: mode === m ? '#F5F5F7' : 'rgba(255,255,255,0.35)',
                    transition: 'all 0.2s', fontFamily: 'inherit',
                  }}>
                  {m === 'login' ? 'Anmelden' : 'Registrieren'}
                </button>
              ))}
            </div>

            <form onSubmit={handleAuth}>
              <div style={{ marginBottom: '14px' }}>
                <label style={{ fontSize: '10px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: '7px' }}>E-Mail</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required
                  style={{ width: '100%', padding: '11px 14px', background: 'rgba(255,255,255,0.05)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '14px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                  onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                  onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'}
                  placeholder="du@beispiel.de" />
              </div>

              <div style={{ marginBottom: '24px' }}>
                <label style={{ fontSize: '10px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: '7px' }}>Passwort</label>
                <input type="password" value={password} onChange={e => setPass(e.target.value)} required minLength={6}
                  style={{ width: '100%', padding: '11px 14px', background: 'rgba(255,255,255,0.05)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '14px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                  onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                  onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'}
                  placeholder="Mindestens 6 Zeichen" />
                {mode === 'login' && (
                  <div style={{ textAlign: 'right', marginTop: '8px' }}>
                    <button type="button" onClick={handleReset} disabled={loading}
                      style={{ fontSize: '11px', color: 'rgba(255,255,255,0.3)', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', padding: 0 }}
                      onMouseEnter={e => e.currentTarget.style.color='rgba(255,255,255,0.6)'}
                      onMouseLeave={e => e.currentTarget.style.color='rgba(255,255,255,0.3)'}>
                      Passwort vergessen?
                    </button>
                  </div>
                )}
              </div>

              {resetSent && (
                <div style={{ marginBottom: '16px', padding: '10px 14px', borderRadius: '10px', background: 'rgba(48,209,88,0.08)', border: '0.5px solid rgba(48,209,88,0.2)', fontSize: '12px', color: '#30D158', lineHeight: 1.4 }}>
                  ✓ Reset-Link gesendet — bitte E-Mail prüfen.
                </div>
              )}

              {error && (
                <div style={{ marginBottom: '16px', padding: '10px 14px', borderRadius: '10px', background: error.includes('gesendet') ? 'rgba(48,209,88,0.08)' : 'rgba(255,69,58,0.08)', border: `0.5px solid ${error.includes('gesendet') ? 'rgba(48,209,88,0.2)' : 'rgba(255,69,58,0.2)'}`, fontSize: '12px', color: error.includes('gesendet') ? '#30D158' : '#FF453A', lineHeight: 1.4 }}>
                  {error}
                </div>
              )}

              <button type="submit" disabled={loading}
                style={{ width: '100%', padding: '13px', borderRadius: '12px', border: 'none', cursor: loading ? 'wait' : 'pointer', background: 'linear-gradient(135deg, #0A84FF 0%, #0066CC 100%)', color: '#fff', fontSize: '14px', fontWeight: 600, opacity: loading ? 0.7 : 1, transition: 'opacity 0.2s', fontFamily: 'inherit', boxShadow: '0 4px 16px rgba(10,132,255,0.25)' }}>
                {loading ? '…' : mode === 'login' ? 'Anmelden →' : 'Konto erstellen →'}
              </button>
            </form>

          </div>
        </div>
      );
    };

    // ── App Wrapper mit Auth ───────────────────────────────────────────────
    const App = () => {
      const [user, setUser]       = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [isPasswordReset, setIsPasswordReset] = useState(false);
      const [newPw, setNewPw]     = useState('');
      const [newPwConfirm, setNewPwConfirm] = useState('');
      const [pwError, setPwError] = useState('');
      const [pwLoading, setPwLoading] = useState(false);
      const [pwDone, setPwDone]   = useState(false);

      useEffect(() => {
        // Supabase schickt nach Password-Reset ein PASSWORD_RECOVERY Event
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            setIsPasswordReset(true);
            setAuthLoading(false);
          } else {
            setUser(session?.user ?? null);
            if (event !== 'INITIAL_SESSION') setAuthLoading(false);
          }
        });
        sb.auth.getSession().then(({ data: { session } }) => {
          if (!isPasswordReset) {
            setUser(session?.user ?? null);
            setAuthLoading(false);
          }
        });
        return () => subscription.unsubscribe();
      }, []);

      const handleNewPassword = async () => {
        if (newPw.length < 6) { setPwError('Mindestens 6 Zeichen.'); return; }
        if (newPw !== newPwConfirm) { setPwError('Passwörter stimmen nicht überein.'); return; }
        setPwLoading(true); setPwError('');
        const { error } = await sb.auth.updateUser({ password: newPw });
        setPwLoading(false);
        if (error) { setPwError(error.message); }
        else { setPwDone(true); setTimeout(() => { setIsPasswordReset(false); setPwDone(false); setNewPw(''); setNewPwConfirm(''); }, 2000); }
      };

      if (authLoading) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0A0A0A' }}>
          <div className="spin" style={{ width: '24px', height: '24px', border: '2px solid rgba(255,255,255,0.1)', borderTopColor: '#0A84FF', borderRadius: '50%' }}/>
        </div>
      );

      // Passwort-Reset Screen
      if (isPasswordReset) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0A0A0A', backgroundImage: 'radial-gradient(ellipse at 30% 50%, rgba(10,132,255,0.08) 0%, transparent 55%)', fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif' }}>
          <div style={{ width: '100%', maxWidth: '360px', padding: '0 24px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '36px', justifyContent: 'center' }}>
              <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M2 24 C6 24 10 16 16 12 C22 16 26 24 30 24" stroke="#F5F5F7" strokeWidth="2.5" strokeLinecap="round" fill="none"/><path d="M2 18 C6 18 10 12 16 8 C22 12 26 18 30 18" stroke="#F5F5F7" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.45"/></svg>
              <span style={{ fontSize: '20px', fontWeight: 700, color: '#F5F5F7', letterSpacing: '-0.02em' }}>Volafly</span>
            </div>
            <div style={{ background: 'rgba(255,255,255,0.04)', border: '0.5px solid rgba(255,255,255,0.09)', borderRadius: '20px', padding: '28px' }}>
              {pwDone ? (
                <div style={{ textAlign: 'center', padding: '12px 0' }}>
                  <div style={{ fontSize: '28px', marginBottom: '12px' }}>✓</div>
                  <div style={{ fontSize: '16px', fontWeight: 600, color: '#30D158' }}>Passwort gesetzt</div>
                  <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)', marginTop: '6px' }}>Du wirst weitergeleitet…</div>
                </div>
              ) : (
                <>
                  <div style={{ fontSize: '18px', fontWeight: 700, color: '#F5F5F7', marginBottom: '6px' }}>Neues Passwort</div>
                  <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)', marginBottom: '24px' }}>Wähle ein neues Passwort für deinen Account.</div>
                  <div style={{ marginBottom: '12px' }}>
                    <label style={{ fontSize: '10px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: '7px' }}>Neues Passwort</label>
                    <input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="Mindestens 6 Zeichen"
                      style={{ width: '100%', padding: '11px 14px', background: 'rgba(255,255,255,0.05)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '14px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                      onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                      onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'} />
                  </div>
                  <div style={{ marginBottom: '20px' }}>
                    <label style={{ fontSize: '10px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.06em', textTransform: 'uppercase', display: 'block', marginBottom: '7px' }}>Passwort bestätigen</label>
                    <input type="password" value={newPwConfirm} onChange={e => setNewPwConfirm(e.target.value)} placeholder="Passwort wiederholen"
                      style={{ width: '100%', padding: '11px 14px', background: 'rgba(255,255,255,0.05)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#F5F5F7', fontSize: '14px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                      onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                      onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'}
                      onKeyDown={e => e.key === 'Enter' && handleNewPassword()} />
                  </div>
                  {pwError && <div style={{ marginBottom: '14px', padding: '10px 14px', borderRadius: '10px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.2)', fontSize: '12px', color: '#FF453A' }}>{pwError}</div>}
                  <button onClick={handleNewPassword} disabled={pwLoading}
                    style={{ width: '100%', padding: '13px', borderRadius: '12px', border: 'none', cursor: pwLoading ? 'wait' : 'pointer', background: 'linear-gradient(135deg, #0A84FF 0%, #0066CC 100%)', color: '#fff', fontSize: '14px', fontWeight: 600, opacity: pwLoading ? 0.7 : 1, fontFamily: 'inherit', boxShadow: '0 4px 16px rgba(10,132,255,0.25)' }}>
                    {pwLoading ? '…' : 'Passwort speichern →'}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );

      if (!user) return <LoginScreen onLogin={setUser} />;
      return <MarketPivot user={user} supabase={sb} />;
    };



const OnboardingOverlay = ({ onboardStep, setOnboardStep, setActiveTab, setShowProfilePanel, setShowConfig, setConfigTab, setDraftThresholds, setValidationErrors, setInputTexts, thresholds, onFinish, fromInfo }) => {
  const [neverShow, setNeverShow] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 700);
  React.useEffect(() => {
    const fn = () => setIsMobile(window.innerWidth < 700);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);

  // Schritt 0 = Intro-Screen, Schritte 1–5 = Guided Tour
  const isIntro = onboardStep === 0;

  const tourSteps = [
    {
      title: 'Marktlage — deine Rohdaten',
      desc: 'Hier siehst du alle Indikatoren in Echtzeit: VIX, Fear & Greed, Credit Spreads, Breadth und mehr. Die Daten werden automatisch geladen.',
      cta: 'Zur Bewertung →',
      badge: 'Marktlage',
    },
    {
      title: 'Bewertung — dein individuelles Risikomanagement',
      desc: 'Volafly wertet alle Indikatoren auf Basis deiner persönlichen Konfiguration aus und leitet daraus einen Investitionsgrad ab. Die Anzahl der Klassen, ihre Farben und Schwellenwerte sind vollständig individuell.',
      cta: 'Konfiguration wählen →',
      badge: 'Bewertung',
    },
    {

  const computeEqualWeights = (draft) => {

  // RFC-4180-kompatibler CSV-Parser: versteht quoted fields mit Kommas/Semikolons darin
  const parseCsvLine = (line, sep) => {
    const fields = [];
    let cur = '';
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i + 1] === '"') { cur += '"'; i++; } // escaped quote
        else inQuote = !inQuote;
      } else if (ch === sep && !inQuote) {
        fields.push(cur.trim());
        cur = '';
      } else {
        cur += ch;
      }
    }
    fields.push(cur.trim());
    return fields;
  };

  const parseSheetsCsv = (text) => {
    const lines = text.replace(/\r/g, '').split('\n');
    const data = {};
    const descs = {};
    if (lines.length < 2) return { data, descs };

    // Detect separator from header
    const header = lines[0];
    const sep = header.includes(';') ? ';' : ',';

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      // Case A: line is a single quoted field containing semicolons (old format)
      // e.g. "VXN;29,87;Desc;",,url
      if (line.startsWith('"') && line.includes(';')) {
        let end = 1;
        while (end < line.length) {
          if (line[end] === '"') {
            if (line[end + 1] === '"') { end += 2; continue; }
            break;
          }
          end++;
        }
        const payload = line.slice(1, end).replace(/""/g, '"');
        if (payload.includes(';')) {
          const parts = parseCsvLine(payload, ';');
          if (parts.length < 2) continue;
          const metric = parts[0].trim();
          if (!metric) continue;
          const valueStr = parts[1].trim().replace(',', '.');
          const value = parseFloat(valueStr);
          if (!isNaN(value)) data[metric] = value;
          if (parts.length >= 3) {
            const desc = parts[2].replace(/;$/, '').trim();
            if (desc) descs[metric] = desc;
          }
          continue;
        }
      }

      // Case B: proper multi-column CSV (sep = , or ;)
      // When sep=',': fields are [Metric, IntPart, DecPart, Desc...] if value has decimal comma
      // e.g. VXN,29,87,Der CBOE Nasdaq...
      // We detect this by checking if field[1] is digits-only and field[2] is digits-only
      const rawParts = parseCsvLine(line, sep);
      if (rawParts.length < 2) continue;

      const metric = rawParts[0].replace(/^["']|["']$/g, '').trim();
      if (!metric) continue;

      let valueStr = rawParts[1].replace(/^["']|["']$/g, '').trim();
      let descIndex = 2;

      // If sep=',' and value looks like it was split on decimal comma:
      // rawParts[1] = "29" and rawParts[2] = "87" (both pure digits/numbers, no letters)
      if (sep === ',' && rawParts.length >= 3) {
        const part1 = rawParts[1].trim();
        const part2 = rawParts[2].trim();
        if (/^\d+$/.test(part1) && /^\d+$/.test(part2)) {
          // Rejoin as decimal number with dot
          valueStr = part1 + '.' + part2;
          descIndex = 3;
        }
      }

      const value = parseFloat(valueStr.replace(',', '.'));
      if (!isNaN(value)) data[metric] = value;

      if (rawParts.length > descIndex) {
        const desc = rawParts[descIndex].replace(/^["']|["']$/g, '').replace(/;$/, '').trim();
        if (desc) descs[metric] = desc;

  const fetchFromSheets = async (isAutoLoad = false, retryCount = 0) => {
    setFetchLoading(true);
    try {
      const res = await fetch(SHEETS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const firstLine = text.split(/\r?\n/)[0] || '';
      const detectedSep = firstLine.includes(';') ? ';' : ',';
      // Leere Antwort → einmal automatisch retry nach 1.5s
      if (!firstLine.trim() && retryCount < 2) {
        setFetchLoading(false);
        setTimeout(() => fetchFromSheets(isAutoLoad, retryCount + 1), 1500);
        return;
      }
      const { data, descs } = parseSheetsCsv(text);
      const known = ['VIX','RVX','VXN','VVIX','VXV','Fear_Greed_Index','Equity_Put_Call_Ratio',
        'Total_Put_Call_Ratio','SKEW_Index','MOVE_Index','Left_Tail_Volatility',
        'VX1','VX2','VX3','VX4','VX5','Yield_2Y','Yield_10Y','Yield_30Y',
        'S5FD_Above_5Day_MA','S5TW_Above_20Day_MA','S5FI_Above_50Day_MA','S5TH_Above_200Day_MA',
        'HY_Spread','DXY','Gold_SP_Ratio','Gold','Silver','WTI','SPX','NDX','RUT','SPX_200D','NDX_200D'];
      const found = known.filter(k => data[k] !== undefined);
      if (found.length === 0) {
        // Beim Auto-Load: retry statt Fehler zeigen
        if (isAutoLoad && retryCount < 2) {
          setFetchLoading(false);
          setTimeout(() => fetchFromSheets(true, retryCount + 1), 1500);
          return;
        }
        throw new Error(`Keine bekannten Felder gefunden (Sep: "${detectedSep}", Header: "${firstLine.slice(0,60)}")`);
      }
      applySheetData(data);
      if (Object.keys(descs).length > 0) setSheetDescs(descs);
      setLastImportDate(new Date());
    } catch (err) {
      setCsvStatus({ type: 'error', msg: `Google Sheets: ${err.message}` });

    setFetchLoading(false);
    setTimeout(() => setCsvStatus(null), 4000);
  };

  const applyPresetById = (pid) => {
    const tpl = PRESET_TEMPLATES.find(t => t.id === pid);
    if (!tpl) return;
    const n = tpl.classes.length;
    // Merge: defaultThresholds als Basis, dann Template-Werte drüber
    const merged = Object.fromEntries(Object.entries(defaultThresholds).map(([key, def]) => {
      const tplVal = tpl.thresholds[key];
      if (!tplVal) return [key, { ...def, active: false }];
      // Falls Template nur true enthält → nur aktivieren, Default-Werte behalten
      if (tplVal === true) {
        const vals = [...def.values];
        while (vals.length < n - 1) vals.push(vals[vals.length-1] ?? 0);
        return [key, { ...def, active: true, values: vals.slice(0, n-1) }];
      }
      // Falls Template vollständige Definition enthält → übernehmen
      const vals = [...(tplVal.values || def.values)];
      while (vals.length < n - 1) vals.push(vals[vals.length-1] ?? 0);
      return [key, {
        ...def,
        active: true,
        values: vals.slice(0, n-1),
        dir: tplVal.dir || def.dir,
        weight: tplVal.weight || def.weight,
      }];
    }));
    const equalized = computeEqualWeights(merged);
    setVolaClasses(tpl.classes);
    setThresholds(equalized);
    setActiveTemplateId(pid);
  };

  const handleFileUpload = (event) => {
    const file = event.target.files[0];
    if (!file) return;

    // Dateiformat prüfen
    if (!file.name.match(/\.(csv|txt)$/i)) {
      setCsvStatus({ type: 'error', msg: 'Ungültiges Format — bitte eine .csv oder .txt Datei hochladen' });
      setTimeout(() => setCsvStatus(null), 4000);
      event.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);

        // Mindest-Struktur prüfen: Header-Zeile muss existieren
        if (lines.length < 2) {
          setCsvStatus({ type: 'error', msg: 'CSV ist leer oder hat kein gültiges Format' });
          setTimeout(() => setCsvStatus(null), 4000);
          event.target.value = ''; return;
        }

        const headerRaw = lines[0].replace(/^["']|["']$/g, '');
        const sep = headerRaw.includes(';') ? ';' : ',';

        const data = {};
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const parts = parseCsvLine(line, sep);
          if (parts.length >= 2) {
            const metric = parts[0].replace(/^["']|["']$/g, '').trim();
            const valueStr = parts[1].replace(/^["']|["']$/g, '').trim().replace(',', '.');
            const value = parseFloat(valueStr);
            if (!isNaN(value)) data[metric] = value;
          }
        }

        // Prüfen ob mindestens ein bekanntes Feld vorhanden ist
        const knownFields = ['VIX','RVX','VXN','VVIX','VXV','Fear_Greed_Index','Equity_Put_Call_Ratio',
          'Total_Put_Call_Ratio','SKEW_Index','MOVE_Index','Left_Tail_Volatility',
          'VX1','VX2','VX3','VX4','VX5','Yield_2Y','Yield_10Y','Yield_30Y',
          'S5FD_Above_5Day_MA','S5TW_Above_20Day_MA','S5FI_Above_50Day_MA','S5TH_Above_200Day_MA',
          'HY_Spread','DXY','Gold_SP_Ratio','Gold','Silver','WTI','SPX','NDX','RUT','SPX_200D','NDX_200D'];
        const foundFields = knownFields.filter(k => data[k] !== undefined);
        if (foundFields.length === 0) {
          setCsvStatus({ type: 'error', msg: 'Keine bekannten Felder gefunden — bitte das Template als Vorlage verwenden' });
          setTimeout(() => setCsvStatus(null), 5000);
          event.target.value = ''; return;
        }

        const newData = {
          volatilityMetrics: {
            rvx: data.RVX ?? marketData.volatilityMetrics.rvx,
            vxn: data.VXN ?? marketData.volatilityMetrics.vxn,
            vix: data.VIX ?? marketData.volatilityMetrics.vix,
            vvix: data.VVIX ?? marketData.volatilityMetrics.vvix,
            vxv: data.VXV ?? marketData.volatilityMetrics.vxv,
            fearGreed: data.Fear_Greed_Index ?? marketData.volatilityMetrics.fearGreed,
            equityPutCall: data.Equity_Put_Call_Ratio ?? marketData.volatilityMetrics.equityPutCall,
            totalPutCall: data.Total_Put_Call_Ratio ?? marketData.volatilityMetrics.totalPutCall,
            skewIndex: data.SKEW_Index ?? marketData.volatilityMetrics.skewIndex,
            moveIndex: data.MOVE_Index ?? marketData.volatilityMetrics.moveIndex,

            vx5: data.VX5 ?? marketData.volatilityMetrics.vx5,
          },
          yieldCurve: {
            y2: data.Yield_2Y ?? marketData.yieldCurve.y2,
            y10: data.Yield_10Y ?? marketData.yieldCurve.y10,
            y30: data.Yield_30Y ?? marketData.yieldCurve.y30,
          },
          movingAverages: { breadth: {
            above5day: data.S5FD_Above_5Day_MA ?? marketData.movingAverages.breadth.above5day,
            above20day: data.S5TW_Above_20Day_MA ?? marketData.movingAverages.breadth.above20day,
            above50day: data.S5FI_Above_50Day_MA ?? marketData.movingAverages.breadth.above50day,
            above200day: data.S5TH_Above_200Day_MA ?? marketData.movingAverages.breadth.above200day,
          }},
          riskIndicators: {
            hySpread: data.HY_Spread ?? marketData.riskIndicators.hySpread,
            dxy:      data.DXY      ?? marketData.riskIndicators.dxy,
            goldSP:   data.Gold_SP_Ratio ?? marketData.riskIndicators.goldSP,
            gold:     data.Gold     ?? marketData.riskIndicators.gold,
            wti:      data.WTI      ?? marketData.riskIndicators.wti,
            silver:   data.Silver    ?? marketData.riskIndicators.silver,
          },
          indices: {
            spx: data.SPX ?? marketData.indices.spx,
            ndx: data.NDX ?? marketData.indices.ndx,
            rut: data.RUT ?? marketData.indices.rut,
            spx200d: data.SPX_200D ?? marketData.indices.spx200d,
            ndx200d: data.NDX_200D ?? marketData.indices.ndx200d,
          },
        };
        setMarketData(newData);
        setLastImportDate(new Date());
        const missing = knownFields.length - foundFields.length;
        const msg = missing > 0
          ? `${foundFields.length} Felder importiert (${missing} nicht gefunden)`
          : 'CSV erfolgreich importiert';
        setCsvStatus({ type: 'success', msg });
        setTimeout(() => setCsvStatus(null), 4000);
        event.target.value = '';
      } catch (error) {
        setCsvStatus({ type: 'error', msg: 'Fehler beim Lesen der Datei — bitte Datei prüfen' });
        setTimeout(() => setCsvStatus(null), 4000);
      }
    };
    reader.readAsText(file);
  };

  const f = (n, d = 1) => n.toFixed(d).replace('.', ',');
  const v = marketData.volatilityMetrics;
  const y = marketData.yieldCurve;
  const b = marketData.movingAverages.breadth;
  const ri = marketData.riskIndicators;
  const idx = marketData.indices || { spx: null, ndx: null, rut: null, spx200d: null, ndx200d: null };

  const fearColor = v.fearGreed < 25 ? '#FF3B30' : v.fearGreed < 45 ? '#FF9500' : v.fearGreed < 55 ? '#FFCC00' : v.fearGreed < 75 ? '#34C759' : '#30D158';
  const contango = v.vx5 > v.vx1;
  const vixRatio = v.vix / v.vxv;

  const formatTime = (date) => {

  const sectionLabel = {

  const metricValue = (color = '#F5F5F7') => ({ fontSize: '18px', fontWeight: 600, color, letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' });

  // ── Anticyclical Volatility Classification ──
  // 5 classes: higher vola class = more fear = higher investment grade (anticyclical)
  const defaultVolaClasses = [
    { label: 'Stille',   color: '#8E8E93', investPct: 40,  subtitle: 'Markt zu ruhig — Complacency-Risiko',          desc: 'Der Markt ist ungewöhnlich ruhig — Vorsicht vor Selbstgefälligkeit. Investitionsgrad bis zu 40% ist angemessen.' },
    { label: 'Ruhe',     color: '#30D158', investPct: 60,  subtitle: 'Geringes Stressniveau — Basis-Exposure',        desc: 'Geringes Stressniveau. Ein rationaler Investor hält eine solide Basis-Position von bis zu 60%.' },
    { label: 'Spannung', color: '#FFCC00', investPct: 80,  subtitle: 'Erhöhte Unsicherheit — selektiv aufbauen',      desc: 'Erhöhte Unsicherheit im Markt. Jetzt selektiv aufbauen — bis zu 80% Investitionsgrad ist rational.' },
    { label: 'Stress',   color: '#FF9F0A', investPct: 90,  subtitle: 'Deutlicher Stress — antizyklisch erhöhen',      desc: 'Deutlicher Stress im Markt. Ein rationaler Investor erhöht jetzt antizyklisch auf bis zu 90%.' },
    { label: 'Panik',    color: '#FF453A', investPct: 110, subtitle: 'Kapitulation — aggressiv investieren',          desc: 'Kapitulation — maximale Angst im Markt. Historisch der beste Kaufzeitpunkt. Bis zu 110% Investitionsgrad ist rational.' },
  ];
  const [volaClasses, setVolaClasses] = useState(defaultVolaClasses);
  const [draftVolaClasses, setDraftVolaClasses] = useState(defaultVolaClasses);

  // ── Vorgefertigte Templates ──
  const classifyFromConfig = (key, value) => {
    const cfg = thresholds[key] ?? defaultThresholds[key];
    if (!cfg) return null;
    const n = volaClasses.length;
    // values has n-1 entries (thresholds between classes)
    const vals = cfg.values.slice(0, n - 1);
    if (cfg.dir === 'asc') {
      for (let i = 0; i < vals.length; i++) { if (value <= vals[i]) return i + 1; }
      return n;
    } else {
      for (let i = 0; i < vals.length; i++) { if (value >= vals[i]) return i + 1; }
      return n;
    }
  };

  // Computed spreads
  const vx1Spread = v.vx1 - v.vix;
  const vx2Spread = v.vx2 - v.vx1;

  // Gold / S&P 500 live ratio
  const goldSPRatio = (idx.spx > 0 && ri.gold > 0) ? idx.spx / ri.gold : (ri.goldSP > 0 ? 1 / ri.goldSP : 0);

  // SPX/NDX above 200D: 0 = below, 1 = above (for threshold: desc, threshold[0]=1 means above=Stille)
  const spxAbove200d = (idx.spx > 0 && idx.spx200d > 0) ? (idx.spx > idx.spx200d ? 1 : 0) : null;
  const ndxAbove200d = (idx.ndx > 0 && idx.ndx200d > 0) ? (idx.ndx > idx.ndx200d ? 1 : 0) : null;

  // Individual indicator assessments
  const indicators = [
    { group: 'Volatilität', label: 'VIX', key: 'vix', level: classifyFromConfig('vix', v.vix), value: f(v.vix) },
    { group: 'Volatilität', label: 'RVX', key: 'rvx', level: classifyFromConfig('rvx', v.rvx), value: f(v.rvx) },
    { group: 'Volatilität', label: 'VXN', key: 'vxn', level: classifyFromConfig('vxn', v.vxn), value: f(v.vxn) },
    { group: 'Volatilität', label: 'VVIX', key: 'vvix', level: classifyFromConfig('vvix', v.vvix), value: f(v.vvix) },
    { group: 'Struktur', label: 'VIX/VXV', key: 'vixVxv', level: classifyFromConfig('vixVxv', vixRatio), value: f(vixRatio, 3) },
    { group: 'Struktur', label: 'VX1 – VIX Spot', key: 'vx1Spread', level: classifyFromConfig('vx1Spread', vx1Spread), value: (vx1Spread >= 0 ? '+' : '') + f(vx1Spread, 2) },
    { group: 'Struktur', label: 'VX2 – VX1', key: 'vx2Spread', level: classifyFromConfig('vx2Spread', vx2Spread), value: (vx2Spread >= 0 ? '+' : '') + f(vx2Spread, 2) },

    { group: 'Sentiment', label: 'Equity P/C', key: 'equityPutCall', level: classifyFromConfig('equityPutCall', v.equityPutCall), value: f(v.equityPutCall, 2) },

  ].filter(ind => ind.level !== null && (thresholds[ind.key]?.active !== false));

  // Weighted average → overall vola class
  const totalWeight = indicators.reduce((sum, ind) => sum + (thresholds[ind.key]?.weight ?? 1), 0) || 1;
  const weightedSum = indicators.reduce((sum, ind) => sum + ind.level * (thresholds[ind.key]?.weight ?? 1), 0);
  const avgLevel = indicators.length > 0 ? weightedSum / totalWeight : 1;
  const overallLevel = Math.min(5, Math.max(1, Math.round(avgLevel)));
  const currentClass = volaClasses[overallLevel - 1];
  // Derive active template name for display
  const activeTemplateName = (() => {

      const p = profiles.find(x => x.id === pid);
      return p ? p.name : null;

    const t = PRESET_TEMPLATES.find(x => x.id === activeTemplateId);
    return t ? t.name : null;
  })();

  const levelDistribution = volaClasses.map((_, i) => indicators.filter(ind => ind.level === i + 1).length);

    y2: 'Yield_2Y', y10: 'Yield_10Y', y30: 'Yield_30Y',

  // ── DATA TAB ──
  const DataView = () => (
    <>

            {[

            ].map((item, i) => {

                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                      <span style={{ fontSize: '11px', color: 'rgba(255,255,255,0.35)' }}>{item.label}</span>

            })}
          </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '8px', marginBottom: '8px' }}>

                    onMouseEnter={e => { if (tvEntry) e.currentTarget.style.background = 'rgba(255,255,255,0.05)'; }}

                    </div>

                      style={{ background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '8px', padding: '5px 4px', fontSize: '12px', fontWeight: 700, color: '#0A84FF', textAlign: 'center', width: '100%', outline: 'none' }}
                      onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                      onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'}
                    />
                    {(() => {
                      const isBin = (cfg.range[1] - cfg.range[0]) <= 1 && Number.isInteger(cfg.range[0]) && Number.isInteger(cfg.range[1]);
                      if (isBin) {
                        // n-1 toggles in the input columns (matching normal rows)
                        return Array.from({length: inputCount}).map((_, vi) => {
                          const val = cfg.values[vi] ?? 1;
                          const isUeber = val >= 1;
                          return (
                            <button key={vi}
                              onClick={() => setDraftThresholds(prev => {
                                const next = { ...prev };
                                const vals = [...(next[key].values || [])];
                                while (vals.length <= vi) vals.push(1);
                                vals[vi] = isUeber ? 0 : 1;
                                return { ...next, [key]: { ...next[key], values: vals } };
                              })}
                              style={{ background: isUeber ? 'rgba(48,209,88,0.1)' : 'rgba(255,69,58,0.1)', border: `0.5px solid ${isUeber ? 'rgba(48,209,88,0.3)' : 'rgba(255,69,58,0.3)'}`, borderRadius: '8px', padding: '5px 4px', fontSize: '10px', fontWeight: 700, color: isUeber ? '#30D158' : '#FF453A', textAlign: 'center', width: '100%', cursor: 'pointer', fontFamily: 'inherit' }}>
                              {isUeber ? '↑ über' : '↓ unter'}
                            </button>
                          );
                        });
                      }
                      return Array.from({length: inputCount}).map((_, vi) => {
                        const val = cfg.values[vi] ?? '';
                        return (
                          <input key={vi} type="text" value={getInputText(key, vi, val)}
                            onChange={e => setInputTexts(prev => ({ ...prev, [`${key}-${vi}`]: e.target.value }))}
                            onBlur={e => {
                              const num = parseFloat(e.target.value.replace(',', '.'));
                              if (!isNaN(num)) {
                                setDraftThresholds(prev => {
                                  const next = { ...prev };
                                  const vals = [...(next[key].values || [])];
                                  while (vals.length <= vi) vals.push(0);
                                  vals[vi] = num;
                                  next[key] = { ...next[key], values: vals };
                                  setTimeout(() => validateAll(next), 0);
                                  return next;
                                });
                              }
                              setInputTexts(prev => { const c = { ...prev }; delete c[`${key}-${vi}`]; return c; });
                            }}
                            style={{ background: err ? 'rgba(255,69,58,0.06)' : 'rgba(255,255,255,0.06)', border: `0.5px solid ${err ? 'rgba(255,69,58,0.3)' : 'rgba(255,255,255,0.08)'}`, borderRadius: '8px', padding: '5px 6px', fontSize: '12px', fontWeight: 600, color: '#F5F5F7', textAlign: 'center', width: '100%', outline: 'none' }}
                            onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                          />
                        );
                      });
                    })()}
                    {/* Last (Panik) column */}
                    {(() => {
                      const isBin = (cfg.range[1] - cfg.range[0]) <= 1 && Number.isInteger(cfg.range[0]) && Number.isInteger(cfg.range[1]);
                      if (isBin) {
                        // Last class toggle — derived from last threshold value
                        const lastVI = inputCount - 1;
                        const lastVal = cfg.values[lastVI] ?? 1;
                        const lastIsUeber = lastVal < 1; // last class gets opposite of last threshold
                        return (
                          <button
                            onClick={() => setDraftThresholds(prev => {
                              const next = { ...prev };
                              const vals = [...(next[key].values || [])];
                              while (vals.length <= lastVI) vals.push(1);
                              vals[lastVI] = lastIsUeber ? 1 : 0;
                              return { ...next, [key]: { ...next[key], values: vals } };
                            })}
                            style={{ background: lastIsUeber ? 'rgba(48,209,88,0.1)' : 'rgba(255,69,58,0.1)', border: `0.5px solid ${lastIsUeber ? 'rgba(48,209,88,0.3)' : 'rgba(255,69,58,0.3)'}`, borderRadius: '8px', padding: '5px 3px', fontSize: '10px', fontWeight: 700, color: lastIsUeber ? '#30D158' : '#FF453A', textAlign: 'center', width: '100%', cursor: 'pointer', fontFamily: 'inherit' }}>
                            {lastIsUeber ? '↑ über' : '↓ unter'}
                          </button>
                        );
                      }
                      return <div style={{ textAlign: 'center', fontSize: '10px', fontWeight: 600, color: lastVC.color, background: `${lastVC.color}10`, border: `0.5px solid ${lastVC.color}30`, borderRadius: '8px', padding: '5px 3px' }}>
                        {cfg.dir === 'asc' ? `>${String(t4).replace('.', ',')}` : `<${String(t4).replace('.', ',')}`}
                      </div>;
                    })()}
                    <div style={{ fontSize: '9px', fontWeight: 600, textAlign: 'center', color: 'rgba(255,255,255,0.3)', padding: '4px', background: 'rgba(255,255,255,0.03)', borderRadius: '6px' }}>
                      {(() => {
                        const isBin = (cfg.range[1] - cfg.range[0]) <= 1 && Number.isInteger(cfg.range[0]) && Number.isInteger(cfg.range[1]);
                        return isBin ? 'über/unter' : (cfg.dir === 'asc' ? '↑ steig.' : '↓ fall.');
                      })()}
                    </div>
                    <button onClick={() => setDraftThresholds(prev => ({ ...prev, [key]: { ...prev[key], active: false } }))}
                      title="Aus Bewertung entfernen"
                      style={{ width: '26px', height: '26px', borderRadius: '50%', border: 'none', background: 'rgba(255,69,58,0.12)', color: '#FF453A', cursor: 'pointer', fontSize: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'inherit', flexShrink: 0 }}
                      onMouseEnter={e => e.currentTarget.style.background='rgba(255,69,58,0.25)'}
                      onMouseLeave={e => e.currentTarget.style.background='rgba(255,69,58,0.12)'}>
                      ×
                    </button>
                  </div>
                );
              })}

              {/* Inactive indicators */}
              {Object.entries(draftThresholds).some(([,c]) => c.active === false) && (
                <div style={{ marginTop: '16px', paddingTop: '12px', borderTop: '0.5px solid rgba(255,255,255,0.06)' }}>
                  <div style={{ fontSize: '10px', color: 'rgba(255,255,255,0.25)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '8px' }}>Nicht aktiv — zum Hinzufügen klicken</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                    {Object.entries(draftThresholds).filter(([,c]) => c.active === false).map(([key, cfg]) => (
                      <button key={key}
                        onClick={() => setDraftThresholds(prev => ({ ...prev, [key]: { ...prev[key], active: true } }))}
                        style={{ padding: '5px 12px', borderRadius: '20px', border: '0.5px solid rgba(255,255,255,0.12)', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.45)', fontSize: '11px', fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: '5px' }}
                        onMouseEnter={e => { e.currentTarget.style.background='rgba(10,132,255,0.1)'; e.currentTarget.style.color='#0A84FF'; e.currentTarget.style.borderColor='rgba(10,132,255,0.3)'; }}
                        onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.45)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.12)'; }}>
                        + {cfg.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ marginTop: '12px', fontSize: '10px', color: 'rgba(255,255,255,0.25)', lineHeight: 1.5 }}>
                <strong style={{ color: 'rgba(255,255,255,0.4)' }}>↑ steigend:</strong> Werte müssen aufsteigend und unterschiedlich sein · <strong style={{ color: 'rgba(255,255,255,0.4)' }}>↓ fallend:</strong> absteigend
              </div>
                </>
              ))} {/* end thresholds tab */}


              {/* Global error summary — only active indicators */}
              {configTab === 'thresholds' && Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length > 0 && (
                <div style={{ marginTop: '12px', padding: '10px 14px', borderRadius: '10px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.2)', fontSize: '11px', color: '#FF453A', lineHeight: 1.5 }}>
                  {Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).map(([k, msg], i) => <div key={i}>• {msg}</div>)}
                </div>
              )}

              {/* ── Footer: Klassen-Tab ── */}
              {configTab === 'classes' && (
                <div style={{ display: 'flex', gap: '8px', marginTop: '16px' }}>
                  <button
                    onClick={() => {
                      setDraftVolaClasses(JSON.parse(JSON.stringify(defaultVolaClasses)));
                    }}
                    style={{ padding: '12px 16px', borderRadius: '12px', border: '0.5px solid rgba(255,255,255,0.1)', cursor: 'pointer', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.4)', fontSize: '13px', fontWeight: 600, whiteSpace: 'nowrap', fontFamily: 'inherit' }}
                    onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.08)'; e.currentTarget.style.color='#F5F5F7'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.4)'; }}>
                    ↺ Zurücksetzen
                  </button>
                  <button
                    onClick={() => {
                      if (draftVolaClasses.length < 2) { alert('Mindestens 2 Klassen erforderlich.'); return; }
                      // Duplicate investPct check only — keine Pflicht zu aufsteigender Reihenfolge
                      const pcts = draftVolaClasses.map(c => c.investPct);
                      const dupes = pcts.filter((p,i) => pcts.indexOf(p) !== i);
                      if (dupes.length > 0) { alert(`Doppelter Investitionsgrad: ${dupes.join(', ')}% — jede Klasse muss einen eindeutigen Wert haben.`); return; }
                      // Apply classes — trim/pad threshold values arrays to n-1
                      const n = draftVolaClasses.length;
                      const adjusted = Object.fromEntries(Object.entries(draftThresholds).map(([key, cfg]) => {
                        const vals = [...cfg.values];
                        while (vals.length < n - 1) vals.push(vals[vals.length - 1] ?? 0);
                        return [key, { ...cfg, values: vals.slice(0, n - 1) }];
                      }));
                      setVolaClasses(JSON.parse(JSON.stringify(draftVolaClasses)));
                      const equalized = computeEqualWeights(adjusted);
                      setDraftThresholds(equalized);
                      setThresholds(JSON.parse(JSON.stringify(equalized)));
                      setActiveTemplateId(null);
                      if (isMobile) { setShowConfig(false); } else { setConfigTab('thresholds'); }
                    }}
                    style={{ flex: 1, padding: '12px', borderRadius: '12px', border: 'none', cursor: 'pointer', background: '#0A84FF', color: '#fff', fontSize: '14px', fontWeight: 600, fontFamily: 'inherit' }}
                    onMouseEnter={e => e.currentTarget.style.opacity='0.85'}
                    onMouseLeave={e => e.currentTarget.style.opacity='1'}>
                    Klassen speichern →
                  </button>
                </div>
              )}

              {/* ── Footer: Grenzwerte-Tab ── */}
              {configTab === 'thresholds' && (
                <div style={{ display: 'flex', gap: '8px', marginTop: '16px' }}>
                  <button
                    onClick={() => {
                      setDraftThresholds(computeEqualWeights(JSON.parse(JSON.stringify(defaultThresholds))));
                      setValidationErrors({});
                      setInputTexts({});
                    }}
                    style={{ padding: '12px 16px', borderRadius: '12px', border: '0.5px solid rgba(255,255,255,0.1)', cursor: 'pointer', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.4)', fontSize: '13px', fontWeight: 600, whiteSpace: 'nowrap', fontFamily: 'inherit' }}
                    onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.08)'; e.currentTarget.style.color='#F5F5F7'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.04)'; e.currentTarget.style.color='rgba(255,255,255,0.4)'; }}>
                    ↺ Zurücksetzen
                  </button>
                  <button
                    onClick={() => {
                      const activeW = Object.values(draftThresholds).filter(c => c.active !== false).reduce((s,c) => s + (c.weight||0), 0);
                      if (activeW !== 100) { alert(`Gewichtungssumme ist ${activeW}% — muss genau 100% ergeben.`); return; }
                      if (validateAll(draftThresholds)) {
                        setThresholds(JSON.parse(JSON.stringify(draftThresholds)));
                        setActiveTemplateId(null);
                        setShowSaveTemplate(true);  // zeige Speichern-Option
                      }
                    }}
                    style={{ flex: 1, padding: '12px', borderRadius: '12px', border: 'none', cursor: 'pointer',
                      background: Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length > 0 ? 'rgba(255,255,255,0.06)' : '#0A84FF',
                      color: Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length > 0 ? 'rgba(255,255,255,0.3)' : '#fff',
                      fontSize: '14px', fontWeight: 600, fontFamily: 'inherit' }}
                    onMouseEnter={e => { if (!Object.entries(validationErrors).filter(([k]) => draftThresholds[k]?.active !== false).length) e.currentTarget.style.opacity='0.85'; }}
                    onMouseLeave={e => e.currentTarget.style.opacity='1'}>
                    Grenzwerte übernehmen
                  </button>
                </div>
              )}

              {/* ── Template speichern (erscheint nach Grenzwerte übernehmen) ── */}
              {showSaveTemplate && (
                <div style={{ marginTop: '16px', padding: '16px', borderRadius: '14px', background: 'rgba(48,209,88,0.05)', border: '0.5px solid rgba(48,209,88,0.2)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#30D158" strokeWidth="2" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                    <span style={{ fontSize: '13px', fontWeight: 700, color: '#30D158' }}>Grenzwerte übernommen</span>
                  </div>
                  <div style={{ fontSize: '11px', color: 'rgba(255,255,255,0.4)', marginBottom: '14px' }}>Möchtest du diese Konfiguration als eigenes Template speichern?</div>
                  {saveTemplateMsg ? (
                    <div style={{ fontSize: '12px', color: saveTemplateMsg.type === 'success' ? '#30D158' : '#FF453A' }}>
                      {saveTemplateMsg.type === 'success' ? '✓' : '⚠'} {saveTemplateMsg.text}
                    </div>
                  ) : (
                    <div style={{ display: 'flex', gap: '8px' }}>
                      <input
                        type="text"
                        value={newTemplateName}
                        onChange={e => setNewTemplateName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && newTemplateName.trim() && saveProfile()}
                        placeholder="z.B. Mein Setup, Konservativ …"
                        style={{ flex: 1, padding: '9px 12px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.12)', borderRadius: '10px', color: '#F5F5F7', fontSize: '13px', outline: 'none', fontFamily: 'inherit' }}
                        onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                        onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.12)'}
                        autoFocus
                      />
                      <button
                        onClick={async () => {
                          const name = newTemplateName.trim();
                          if (!name) return;
                          setProfileLoading(true);
                          const isFirst = profiles.length === 0;
                          const { data, error } = await sbClient
                            .from('threshold_profiles')
                            .insert({ user_id: user.id, name, thresholds, is_default: isFirst })
                            .select().single();
                          setProfileLoading(false);
                          if (!error && data) {
                            setProfiles(prev => [data, ...prev]);
                            setActiveProfileId(data.id);
                            setSaveTemplateMsg({ type: 'success', text: `„${name}" gespeichert` });
                            setNewTemplateName('');
                            setTimeout(() => { setSaveTemplateMsg(null); setShowSaveTemplate(false); setShowConfig(false); }, 1800);
                          } else {
                            setSaveTemplateMsg({ type: 'error', text: 'Fehler beim Speichern' });
                          }
                        }}
                        disabled={!newTemplateName.trim() || profileLoading}
                        style={{ padding: '9px 16px', borderRadius: '10px', border: 'none', cursor: newTemplateName.trim() ? 'pointer' : 'default', background: newTemplateName.trim() ? '#30D158' : 'rgba(255,255,255,0.08)', color: newTemplateName.trim() ? '#000' : 'rgba(255,255,255,0.25)', fontSize: '13px', fontWeight: 600, fontFamily: 'inherit', whiteSpace: 'nowrap' }}>
                        {profileLoading ? '…' : 'Speichern'}
                      </button>
                      <button
                        onClick={() => { setShowSaveTemplate(false); setShowConfig(false); }}
                        style={{ padding: '9px 12px', borderRadius: '10px', border: '0.5px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.4)', fontSize: '13px', fontFamily: 'inherit', cursor: 'pointer' }}>
                        Überspringen
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        )}

        {/* CSV Status Toast */}
        {csvStatus && (
          <div style={{
            marginBottom: '8px', padding: '10px 14px', borderRadius: '12px',
            background: csvStatus.type === 'success' ? 'rgba(48,209,88,0.08)' : 'rgba(255,69,58,0.08)',
            border: `0.5px solid ${csvStatus.type === 'success' ? 'rgba(48,209,88,0.2)' : 'rgba(255,69,58,0.2)'}`,
            fontSize: '11px', fontWeight: 500,
            color: csvStatus.type === 'success' ? '#30D158' : '#FF453A',
            display: 'flex', alignItems: 'center', gap: '8px',
          }}>
            <span>{csvStatus.type === 'success' ? '✓' : '⚠'} {csvStatus.msg}</span>
            <button onClick={() => setCsvStatus(null)} style={{
              marginLeft: 'auto', background: 'none', border: 'none',
              color: 'rgba(255,255,255,0.3)', cursor: 'pointer', fontSize: '14px', lineHeight: 1,
            }}>×</button>
          </div>
        )}

        {/* Tab Content */}
        {activeTab === 'data' ? <DataView /> : (
          <>
            {/* Option A — Kontext-Banner oben im Bewertungs-Tab */}
            <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'flex-start' : 'center', justifyContent: 'space-between', gap: '8px', marginBottom: '8px', padding: '9px 14px', background: 'rgba(255,255,255,0.03)', border: '0.5px solid rgba(255,255,255,0.06)', borderRadius: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: lastImportDate ? '#30D158' : '#FF9F0A', boxShadow: lastImportDate ? '0 0 6px #30D158' : '0 0 6px #FF9F0A', flexShrink: 0 }} />
                <span style={{ fontSize: '11px', color: 'rgba(255,255,255,0.35)', fontVariantNumeric: 'tabular-nums' }}>
                  {lastImportDate
                    ? `Interpretation basierend auf Marktdaten vom ${formatTime(lastImportDate)}`
                    : 'Interpretation basierend auf Demo-Daten — bitte CSV importieren'}
                </span>
              </div>
              <button
                onClick={() => setActiveTab('data')}
                style={{ display: 'flex', alignItems: 'center', gap: '4px', padding: '4px 10px', borderRadius: '8px', border: '0.5px solid rgba(255,255,255,0.08)', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.35)', fontSize: '10px', fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', alignSelf: isMobile ? 'flex-end' : 'auto' }}
                onMouseEnter={e => { e.currentTarget.style.color = '#F5F5F7'; e.currentTarget.style.background = 'rgba(255,255,255,0.08)'; }}
                onMouseLeave={e => { e.currentTarget.style.color = 'rgba(255,255,255,0.35)'; e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; }}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                Zur Marktlage
              </button>
            </div>
            <AnalysisView />
          </>
        )}

      </div>

      {/* ── Onboarding Overlay (einmalig nach Login + via ?) ── */}
      {showOnboarding && (
        <OnboardingOverlay
          onboardStep={onboardStep}
          setOnboardStep={setOnboardStep}
          setActiveTab={setActiveTab}
          setShowProfilePanel={setShowProfilePanel}
          setShowConfig={setShowConfig}
          setConfigTab={setConfigTab}
          setDraftThresholds={setDraftThresholds}
          setValidationErrors={setValidationErrors}
          setInputTexts={setInputTexts}
          thresholds={thresholds}
          fromInfo={onboardingFromInfo}
          onFinish={() => {
            setShowOnboarding(false);
            setOnboardingFromInfo(false);
            setOnboardStep(0);
          }}
        />
      )}

      {/* Kontakt Modal */}
      {showContact && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px' }}>
          <div style={{ background: '#1C1C1E', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '20px', padding: '28px', width: '100%', maxWidth: '420px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
              <div>
                <h3 style={{ fontSize: '18px', fontWeight: 700, margin: 0, color: '#F5F5F7' }}>Kontakt</h3>
                <div style={{ fontSize: '11px', color: 'rgba(255,255,255,0.3)', marginTop: '3px' }}>Wir freuen uns über dein Feedback</div>
              </div>
              <button onClick={() => { setShowContact(false); setContactEmail(''); setContactMsg(''); setContactError(''); setContactSent(false); }}
                style={{ background: 'rgba(255,255,255,0.08)', border: 'none', borderRadius: '50%', width: '28px', height: '28px', cursor: 'pointer', color: '#F5F5F7', fontSize: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
            </div>

            {contactSent ? (
              <div style={{ textAlign: 'center', padding: '24px 0' }}>
                <div style={{ fontSize: '32px', marginBottom: '12px' }}>✓</div>
                <div style={{ fontSize: '16px', fontWeight: 600, color: '#30D158', marginBottom: '6px' }}>Nachricht gesendet</div>
                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)' }}>Wir melden uns so schnell wie möglich.</div>
              </div>
            ) : (
              <>
                <div style={{ marginBottom: '12px' }}>
                  <div style={{ fontSize: '11px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '6px' }}>Deine E-Mail</div>
                  <input type="email" value={contactEmail} onChange={e => setContactEmail(e.target.value)}
                    placeholder="du@beispiel.de"
                    style={{ width: '100%', padding: '10px 12px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#F5F5F7', fontSize: '13px', outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }}
                    onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                    onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'} />
                </div>
                <div style={{ marginBottom: '20px' }}>
                  <div style={{ fontSize: '11px', fontWeight: 600, color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '6px' }}>Nachricht</div>
                  <textarea value={contactMsg} onChange={e => setContactMsg(e.target.value)}
                    placeholder="Deine Nachricht…" rows={5}
                    style={{ width: '100%', padding: '10px 12px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#F5F5F7', fontSize: '13px', outline: 'none', fontFamily: 'inherit', resize: 'vertical', boxSizing: 'border-box' }}
                    onFocus={e => e.target.style.borderColor='rgba(10,132,255,0.5)'}
                    onBlur={e => e.target.style.borderColor='rgba(255,255,255,0.1)'} />
                </div>
                {contactError && (
                  <div style={{ marginBottom: '12px', padding: '8px 12px', borderRadius: '8px', background: 'rgba(255,69,58,0.08)', border: '0.5px solid rgba(255,69,58,0.2)', fontSize: '12px', color: '#FF453A' }}>
                    ⚠ {contactError}
                  </div>
                )}
                <button
                  onClick={async () => {
                    if (!contactEmail.trim() || !contactMsg.trim()) return;
                    setContactSending(true);
                    setContactError('');
                    try {
                      const res = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({
                          access_key: WEB3FORMS_KEY,
                          subject: 'Volafly Kontakt',
                          from_name: contactEmail.trim(),
                          email: contactEmail.trim(),
                          message: contactMsg.trim(),
                        }),
                      });
                      const json = await res.json();
                      if (!json.success) throw new Error(json.message || 'Fehler');
                      setContactSent(true);
                      setContactEmail('');
                      setContactMsg('');
                    } catch(err) {
                      setContactError('Versand fehlgeschlagen — bitte später erneut versuchen.');
                    }
                    setContactSending(false);
                  }}
                  disabled={!contactEmail.trim() || !contactMsg.trim() || contactSending}
                  style={{ width: '100%', padding: '12px', borderRadius: '12px', border: 'none', fontFamily: 'inherit', fontSize: '14px', fontWeight: 600, transition: 'all 0.2s ease', cursor: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'default' : 'pointer', background: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'rgba(255,255,255,0.06)' : '#0A84FF', color: (!contactEmail.trim() || !contactMsg.trim() || contactSending) ? 'rgba(255,255,255,0.25)' : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                  {contactSending && <span style={{ display: 'inline-block', width: '12px', height: '12px', border: '1.5px solid rgba(255,255,255,0.3)', borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />}
                  {contactSending ? 'Wird gesendet…' : 'Nachricht senden'}
                </button>
              </>
            )}
          </div>
        </div>
      )}

    </div>
  );
};

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
