<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volafly · Launch Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0A0A; font-family: 'Inter', system-ui, sans-serif; }
    #root { position: fixed; inset: 0; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
  <div id="root"></div>

  <!-- ── Animations Framework (Stage, Sprite, hooks, easings) ── -->
  <script type="text/babel" data-presets="env,react">

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook.
//
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 0; // bar removed for autoplay-loop
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* PlaybackBar removed — autoplay-loop only */}
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});


  </script>

  <!-- ── Scene 1: Market Noise ── -->
  <script type="text/babel" data-presets="env,react">
// Scene 1 — Market Noise (0–4s)
// Chaos: fragments of market data flying in, a question "Was soll ich tun?"

function SceneNoise({ start = 0, end = 4.2 }) {
  return (
    <Sprite start={start} end={end}>
      <NoiseInner />
    </Sprite>
  );
}

function NoiseInner() {
  const { localTime, duration, progress } = useSprite();

  // 20+ market data fragments with varied timing
  const fragments = [
    { text: 'VIX 28.4',         x: 120, y: 110, color: '#FF9F0A', size: 34, delay: 0.0 },
    { text: 'Fear & Greed 22',  x: 1350, y: 140, color: '#FF453A', size: 30, delay: 0.1 },

  // The central question fades in after 1.4s

  const exitStart = duration - 0.6;

  <script type="text/babel" data-presets="env,react">
// Scene 2 — Logo reveal (4.2–8.5s)
// The volafly logo draws in with the wave paths; tagline types below.

function SceneLogo({ start = 4.2, end = 8.5 }) {
  return (
    <Sprite start={start} end={end}>
      <LogoInner />
    </Sprite>
  );
}

function LogoInner() {
  const { localTime, duration } = useSprite();

  // wave draw: 0 → 1.2s
  const drawP = Math.min(1, localTime / 1.2);
  const wave1Dash = 120 - 120 * Easing.easeInOutCubic(drawP);
  const wave2Dash = 120 - 120 * Easing.easeInOutCubic(Math.max(0, drawP - 0.12));

  // wordmark fade: 0.7 → 1.6
  const wordT = Math.max(0, Math.min(1, (localTime - 0.7) / 0.9));
  const wordOpacity = Easing.easeOutCubic(wordT);
  const wordTy = (1 - Easing.easeOutCubic(wordT)) * 20;

  // tagline: 1.3 → 2.4
  const tagT = Math.max(0, Math.min(1, (localTime - 1.3) / 1.1));
  const tagChars = 'Volatilität lesen. On the fly.'.length;
  const shown = Math.floor(tagChars * tagT);
  const tagText = 'Volatilität lesen. On the fly.'.substring(0, shown);
  const caret = tagT < 1 && Math.floor(localTime * 3) % 2 === 0;

  // Global exit
  const exitStart = duration - 0.55;
  const exiting = localTime > exitStart;
  const exitT = exiting ? Easing.easeInCubic((localTime - exitStart) / 0.55) : 0;
  const globalOpacity = 1 - exitT;
  const globalScale = 1 + exitT * 0.04;
  const globalTy = -exitT * 20;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      opacity: globalOpacity,
      transform: `translateY(${globalTy}px) scale(${globalScale})`,

            <defs>
              <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#0A84FF" />
                <stop offset="100%" stopColor="#BF5AF2" />
              </linearGradient>
            </defs>
            <path
              d="M2 18 C 8 8, 12 8, 16 16 C 20 24, 24 24, 30 14"
              stroke="url(#logo-g)"
              strokeWidth="2.5"
              fill="none"
              strokeLinecap="round"
              strokeDasharray="120"
              strokeDashoffset={wave1Dash}
            />
            <path
              d="M2 22 C 8 12, 12 12, 16 20 C 20 28, 24 28, 30 18"
              stroke="url(#logo-g)"
              strokeWidth="2.5"
              fill="none"
              strokeLinecap="round"
              strokeDasharray="120"
              strokeDashoffset={wave2Dash}
              opacity="0.45"
            />
          </svg>
          {/* Wordmark */}
          <div style={{
            fontFamily: 'Inter, system-ui, sans-serif',
            fontSize: 152,
            fontWeight: 700,
            color: '#F5F5F7',
            letterSpacing: '-0.04em',
            lineHeight: 1,
            opacity: wordOpacity,
            transform: `translateY(${wordTy}px)`,
          }}>
            Volafly
          </div>
        </div>
        {/* Tagline */}
        <div style={{
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',
          fontSize: 28,
          color: 'rgba(255,255,255,0.55)',
          letterSpacing: '0.02em',
          minHeight: 36,
        }}>
          {tagText}<span style={{ opacity: caret ? 1 : 0, color: '#0A84FF' }}>▊</span>
        </div>
      </div>
    </div>
  );
}

window.SceneLogo = SceneLogo;

  </script>

  <script type="text/babel" data-presets="env,react">
// Scene 4 — Die 5 Stufen (14.5–22s)
// Stille · Ruhe · Spannung · Stress · Panik
// A vola wave sweeps across, highlighting each stage in turn.

function SceneClasses({ start = 14.5, end = 22 }) {
  return (
    <Sprite start={start} end={end}>
      <ClassesInner />
    </Sprite>
  );
}

function ClassesInner() {
  const { localTime, duration } = useSprite();

  const classes = [
    { num: '01', name: 'Stille',   color: '#8E8E93', rec: 'Komplacency.\nAbsichern.',            pct: '40%' },
    { num: '02', name: 'Ruhe',     color: '#30D158', rec: 'Gesunder Markt.\nQuote erhöhen.',     pct: '60%' },
    { num: '03', name: 'Spannung', color: '#FFCC00', rec: 'Unsicherheit.\nQuote halten.',        pct: '80%' },
    { num: '04', name: 'Stress',   color: '#FF9F0A', rec: 'Anspannung.\nNachkäufe planen.',      pct: '90%' },
    { num: '05', name: 'Panik',    color: '#FF453A', rec: 'Kapitulation.\nAntizyklisch kaufen.', pct: '110%' },
  ];

  // Title
  const titleT = Math.max(0, Math.min(1, localTime / 0.6));
  const titleOpacity = Easing.easeOutCubic(titleT);
  const titleTy = (1 - titleOpacity) * 14;

  // Cards enter staggered from 0.5s → 2.5s
  const cardBase = 0.55;
  const cardStep = 0.22;

  // Highlight moves through cards from 2.8s
  const highlightStart = 2.8;
  const highlightDur = 3.5;
  const highlightT = Math.max(0, Math.min(1, (localTime - highlightStart) / highlightDur));
  const activeIdx = Math.min(4, Math.floor(highlightT * 5));

  // Global exit
  const exitStart = duration - 0.5;
  const exitT = localTime > exitStart ? Easing.easeInCubic((localTime - exitStart) / 0.5) : 0;
  const globalOpacity = 1 - exitT;

  const cardW = 300;
  const gap = 24;
  const totalW = cardW * 5 + gap * 4;
  const startX = (1920 - totalW) / 2;

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: globalOpacity }}>
      {/* Title */}
      <div style={{
        position: 'absolute', top: 130, left: '50%',
        transform: `translate(-50%, ${titleTy}px)`,
        opacity: titleOpacity,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 20, fontWeight: 500,
        color: 'rgba(255,255,255,0.45)',
        letterSpacing: '0.12em', textTransform: 'uppercase',

        position: 'absolute', top: 170, left: '50%',

        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 64, fontWeight: 600,
        color: '#F5F5F7', letterSpacing: '-0.03em',
        whiteSpace: 'nowrap',
      }}>
        Jeder Zustand hat eine Farbe.
      </div>

      {/* Cards */}
      {classes.map((c, i) => {
        const t = Math.max(0, Math.min(1, (localTime - cardBase - i * cardStep) / 0.5));
        const eased = Easing.easeOutBack(t);
        const opacity = Math.min(1, t * 1.5);
        const ty = (1 - eased) * 40;
        const isActive = i === activeIdx && localTime > highlightStart;
        const wasActive = i < activeIdx;

        return (
          <div
            key={i}
            style={{
              position: 'absolute',
              left: startX + i * (cardW + gap),
              top: 360,
              width: cardW,
              height: 420,
              padding: '32px 28px',
              background: isActive ? `${c.color}14` : 'rgba(255,255,255,0.02)',
              border: `1px solid ${isActive ? c.color : c.color + '33'}`,
              borderRadius: 20,
              opacity: opacity * (wasActive ? 0.55 : 1),
              transform: `translateY(${ty}px) scale(${isActive ? 1.04 : 0.96 + 0.04 * eased})`,
              transition: 'background 280ms, border-color 280ms, transform 280ms, opacity 280ms',
              boxShadow: isActive ? `0 24px 60px ${c.color}40, 0 0 0 1px ${c.color}66 inset` : 'none',
              display: 'flex', flexDirection: 'column',
            }}
          >
            <div style={{
              fontFamily: 'JetBrains Mono, ui-monospace, monospace',
              fontSize: 14, fontWeight: 500,
              color: 'rgba(255,255,255,0.35)',
              letterSpacing: '0.1em',
            }}>
              {c.num}
            </div>
            <div style={{
              width: 56, height: 56, borderRadius: 28,
              background: c.color,
              marginTop: 24, marginBottom: 28,
              boxShadow: isActive ? `0 0 40px ${c.color}` : `0 0 20px ${c.color}88`,
              transition: 'box-shadow 280ms',
            }} />
            <div style={{
              fontFamily: 'Inter, system-ui, sans-serif',
              fontSize: 44, fontWeight: 600,
              color: c.color,
              letterSpacing: '-0.02em',
              marginBottom: 20,
            }}>
              {c.name}
            </div>
            <div style={{
              fontFamily: 'Inter, system-ui, sans-serif',
              fontSize: 19, fontWeight: 400,
              color: 'rgba(255,255,255,0.7)',
              lineHeight: 1.35,
              whiteSpace: 'pre-line',
              marginBottom: 'auto',
            }}>
              {c.rec}
            </div>
            <div style={{
              marginTop: 20,
              paddingTop: 16,
              borderTop: '1px solid rgba(255,255,255,0.08)',
              display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
            }}>
              <span style={{
                fontFamily: 'Inter, system-ui, sans-serif',
                fontSize: 12, fontWeight: 500,
                color: 'rgba(255,255,255,0.4)',
                letterSpacing: '0.1em', textTransform: 'uppercase',
              }}>Invest</span>
              <span style={{
                fontFamily: 'Inter, system-ui, sans-serif',
                fontSize: 28, fontWeight: 700,
                color: isActive ? c.color : 'rgba(255,255,255,0.85)',
                letterSpacing: '-0.02em',
                transition: 'color 280ms',
              }}>{c.pct}</span>
            </div>
          </div>
        );
      })}

      {/* Gradient wave underneath */}
      <svg
        width="1920" height="140"
        style={{ position: 'absolute', left: 0, top: 820, opacity: 0.4 }}
      >
        <defs>
          <linearGradient id="classwave" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#8E8E93" />
            <stop offset="25%" stopColor="#30D158" />
            <stop offset="50%" stopColor="#FFCC00" />
            <stop offset="75%" stopColor="#FF9F0A" />
            <stop offset="100%" stopColor="#FF453A" />
          </linearGradient>
        </defs>
        <path
          d="M 0 70 Q 240 30, 480 70 T 960 70 T 1440 70 T 1920 70"
          stroke="url(#classwave)"
          strokeWidth="3"
          fill="none"
          strokeDasharray="2400"
          strokeDashoffset={2400 - 2400 * Math.min(1, localTime / 2.5)}
        />
      </svg>
    </div>
  );
}

window.SceneClasses = SceneClasses;

  </script>

  <!-- ── Scene 5: Anticyclical ── -->
  <script type="text/babel" data-presets="env,react">
// Scene 5 — Antizyklisch, statt emotional (22–30s)
// Market curve with panic dip; emotional investor sells at bottom,
// rational (Volafly) investor buys at bottom.

function SceneAnticyclical({ start = 22, end = 30 }) {
  return (
    <Sprite start={start} end={end}>
      <AntiInner />
    </Sprite>
  );
}

function AntiInner() {
  const { localTime, duration } = useSprite();

  // Canvas area
  const chartX = 260;
  const chartY = 420;
  const chartW = 1400;
  const chartH = 440;

  // Curve samples — steady up, deep panic dip, recovery
  // domain 0..100 on x, price 0..100 on y (0=bottom of chart)
  const pts = [];
  const N = 200;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    // baseline upward drift
    let p = 50 + t * 20;
    // panic dip centered at ~0.55
    const dipCenter = 0.55;
    const dipWidth = 0.15;
    const dipDepth = 34;
    p -= dipDepth * Math.exp(-Math.pow((t - dipCenter) / dipWidth, 2));
    // subtle oscillation
    p += Math.sin(t * 18) * 1.5;
    pts.push(p);
  }

  // Curve draw animation
  const curveT = Math.max(0, Math.min(1, (localTime - 0.6) / 2.2));
  const visibleIdx = Math.floor(curveT * N);

  const toSvgX = (i) => chartX + (i / N) * chartW;
  const toSvgY = (p) => chartY + chartH - (p / 100) * chartH;

  let pathD = '';
  for (let i = 0; i <= visibleIdx; i++) {
    pathD += (i === 0 ? 'M' : 'L') + ' ' + toSvgX(i) + ' ' + toSvgY(pts[i]) + ' ';
  }

  // Bottom of dip index ~= 0.55 * N
  const dipIdx = Math.floor(0.55 * N);
  const dipX = toSvgX(dipIdx);
  const dipY = toSvgY(pts[dipIdx]);

  // Emotional investor marker appears when dip is reached
  const emoT = Math.max(0, Math.min(1, (localTime - 2.4) / 0.6));
  // Rational marker appears a beat later
  const ratT = Math.max(0, Math.min(1, (localTime - 3.2) / 0.7));

  // Title
  const titleT = Math.max(0, Math.min(1, localTime / 0.6));
  const titleOpacity = Easing.easeOutCubic(titleT);
  const titleTy = (1 - titleOpacity) * 14;

  // Conclusion banner ~ 5.0s
  const conclT = Math.max(0, Math.min(1, (localTime - 5.0) / 0.8));

  // Exit
  const exitStart = duration - 0.5;
  const exitT = localTime > exitStart ? Easing.easeInCubic((localTime - exitStart) / 0.5) : 0;
  const globalOpacity = 1 - exitT;

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: globalOpacity }}>
      {/* Title */}
      <div style={{
        position: 'absolute', top: 120, left: '50%',
        transform: `translate(-50%, ${titleTy}px)`,
        opacity: titleOpacity,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 20, fontWeight: 500,
        color: 'rgba(255,255,255,0.45)',
        letterSpacing: '0.12em', textTransform: 'uppercase',
      }}>
        Das Prinzip
      </div>
      <div style={{
        position: 'absolute', top: 160, left: '50%',
        transform: `translate(-50%, ${titleTy}px)`,
        opacity: titleOpacity,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 72, fontWeight: 600,
        color: '#F5F5F7', letterSpacing: '-0.03em',
        whiteSpace: 'nowrap',
      }}>
        Antizyklisch, <em style={{ fontStyle: 'italic', color: '#0A84FF' }}>statt</em> emotional.
      </div>

      {/* Chart SVG */}
      <svg width="1920" height="1080" style={{ position: 'absolute', inset: 0 }}>
        {/* grid */}
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line
            key={i}
            x1={chartX} x2={chartX + chartW}
            y1={chartY + chartH * f} y2={chartY + chartH * f}
            stroke="rgba(255,255,255,0.05)"
            strokeDasharray="4 6"
          />
        ))}
        <line
          x1={chartX} x2={chartX + chartW}
          y1={chartY + chartH} y2={chartY + chartH}
          stroke="rgba(255,255,255,0.15)"
        />

        {/* market curve */}
        <path
          d={pathD}
          stroke="rgba(255,255,255,0.7)"
          strokeWidth="3"
          fill="none"
          strokeLinecap="round"
          strokeLinejoin="round"
        />

        {/* curve leading edge glow */}
        {visibleIdx > 0 && visibleIdx <= N && (
          <circle
            cx={toSvgX(visibleIdx)}
            cy={toSvgY(pts[visibleIdx])}
            r="6"
            fill="#F5F5F7"
          />
        )}

        {/* Panik label on dip */}
        {emoT > 0 && (
          <g opacity={emoT}>
            <line
              x1={dipX} y1={dipY + 16}
              x2={dipX} y2={dipY + 60}
              stroke="#FF453A"
              strokeWidth="2"
              strokeDasharray="3 4"
            />
          </g>
        )}

        {/* Rational arrow */}
        {ratT > 0 && (
          <g opacity={ratT}>
            <line
              x1={dipX} y1={dipY - 16}
              x2={dipX} y2={dipY - 80}
              stroke="#30D158"
              strokeWidth="2.5"
              strokeDasharray="4 4"
            />
            <path
              d={`M ${dipX - 8} ${dipY - 14} L ${dipX} ${dipY - 4} L ${dipX + 8} ${dipY - 14}`}
              fill="none" stroke="#30D158" strokeWidth="2.5"
              strokeLinecap="round" strokeLinejoin="round"
            />
          </g>
        )}
      </svg>

      {/* Emotional investor label (below the dip) */}
      {emoT > 0 && (
        <div style={{
          position: 'absolute',
          left: dipX, top: dipY + 70,
          transform: `translate(-50%, 0) scale(${0.9 + 0.1 * emoT})`,
          opacity: emoT,
        }}>
          <div style={{
            padding: '10px 18px',
            background: 'rgba(255,69,58,0.12)',
            border: '1px solid rgba(255,69,58,0.4)',
            borderRadius: 10,
            fontFamily: 'Inter, system-ui, sans-serif',
            fontSize: 20,
            color: '#FF453A',
            fontWeight: 500,
            textAlign: 'center',
            whiteSpace: 'nowrap',
          }}>
            Emotional: <strong style={{ fontWeight: 700 }}>verkauft</strong>
          </div>
        </div>
      )}

      {/* Rational (Volafly) label above dip */}
      {ratT > 0 && (
        <div style={{
          position: 'absolute',
          left: dipX, top: dipY - 150,
          transform: `translate(-50%, 0) scale(${0.9 + 0.1 * ratT})`,
          opacity: ratT,
        }}>
          <div style={{
            padding: '12px 20px',
            background: 'rgba(48,209,88,0.12)',
            border: '1px solid rgba(48,209,88,0.45)',
            borderRadius: 10,
            fontFamily: 'Inter, system-ui, sans-serif',
            fontSize: 22,
            color: '#30D158',
            fontWeight: 600,
            textAlign: 'center',
            whiteSpace: 'nowrap',
            boxShadow: '0 20px 60px rgba(48,209,88,0.15)',
          }}>
            Volafly · Panik · <strong style={{ fontWeight: 700 }}>Investitionsgrad 110%</strong>
          </div>
        </div>
      )}

      {/* Conclusion */}
      <div style={{
        position: 'absolute',
        left: '50%', top: 930,
        transform: `translate(-50%, ${(1 - conclT) * 14}px)`,
        opacity: conclT,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 30, fontWeight: 400,
        color: 'rgba(255,255,255,0.6)',
        letterSpacing: '-0.01em',
        whiteSpace: 'nowrap',
      }}>
        Ein Regelwerk. Datenbasiert. <span style={{ color: '#F5F5F7', fontWeight: 600 }}>Rational.</span>
      </div>
    </div>
  );
}

window.SceneAnticyclical = SceneAnticyclical;

  </script>

  <!-- ── Scene 6: Call To Action ── -->
  <script type="text/babel" data-presets="env,react">
// Scene 6 — CTA (30–38s)
// Volafly logo + "volafly.net" + "Kostenlos starten"

function SceneCTA({ start = 30, end = 38 }) {
  return (
    <Sprite start={start} end={end}>
      <CTAInner />
    </Sprite>
  );
}

function CTAInner() {
  const { localTime, duration } = useSprite();

  // Logo reappears
  const logoT = Math.max(0, Math.min(1, localTime / 0.9));
  const logoOpacity = Easing.easeOutCubic(logoT);
  const logoScale = 0.9 + 0.1 * Easing.easeOutBack(logoT);

  // Tagline line
  const tagT = Math.max(0, Math.min(1, (localTime - 0.7) / 0.8));

  // URL
  const urlT = Math.max(0, Math.min(1, (localTime - 1.3) / 0.8));
  const urlOpacity = Easing.easeOutCubic(urlT);
  const urlTy = (1 - urlOpacity) * 20;

  // Button
  const btnT = Math.max(0, Math.min(1, (localTime - 2.0) / 0.7));
  const btnOpacity = Easing.easeOutCubic(btnT);
  const btnScale = 0.9 + 0.1 * Easing.easeOutBack(btnT);

  // Gentle breathing glow
  const pulse = 0.5 + 0.5 * Math.sin(localTime * 2.2);

  // Subtitle "Keine Anlageberatung"
  const subT = Math.max(0, Math.min(1, (localTime - 2.8) / 0.6));

  // Exit
  const exitStart = duration - 0.4;
  const exitT = localTime > exitStart ? Easing.easeInCubic((localTime - exitStart) / 0.4) : 0;
  const globalOpacity = 1 - exitT;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      opacity: globalOpacity,
      background: 'radial-gradient(ellipse at center, rgba(10,132,255,0.08) 0%, rgba(10,10,10,0) 60%)',
    }}>
      {/* Logo */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 24,
        opacity: logoOpacity,
        transform: `scale(${logoScale})`,
        marginBottom: 28,
      }}>
        <svg width="96" height="96" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="cta-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="#0A84FF" />
              <stop offset="100%" stopColor="#BF5AF2" />
            </linearGradient>
          </defs>
          <path d="M2 18 C 8 8, 12 8, 16 16 C 20 24, 24 24, 30 14"
                stroke="url(#cta-g)" strokeWidth="2.5" fill="none" strokeLinecap="round" />
          <path d="M2 22 C 8 12, 12 12, 16 20 C 20 28, 24 28, 30 18"
                stroke="url(#cta-g)" strokeWidth="2.5" fill="none" strokeLinecap="round" opacity="0.45" />
        </svg>
        <div style={{
          fontFamily: 'Inter, system-ui, sans-serif',
          fontSize: 96, fontWeight: 700,
          color: '#F5F5F7', letterSpacing: '-0.04em', lineHeight: 1,
        }}>
          Volafly
        </div>
      </div>

      {/* Tagline */}
      <div style={{
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 48, fontWeight: 300,
        color: '#F5F5F7',
        letterSpacing: '-0.02em',
        opacity: tagT,
        transform: `translateY(${(1 - tagT) * 14}px)`,
        marginBottom: 16,
        textAlign: 'center',
      }}>
        Volatilität lesen. <em style={{ fontStyle: 'italic', fontWeight: 500 }}>On the fly.</em>
      </div>

      {/* URL */}
      <div style={{
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 34,
        color: 'rgba(255,255,255,0.55)',
        letterSpacing: '0.02em',
        opacity: urlOpacity,
        transform: `translateY(${urlTy}px)`,
        marginBottom: 56,
      }}>
        → <span style={{
          background: 'linear-gradient(135deg, #0A84FF 0%, #BF5AF2 100%)',
          WebkitBackgroundClip: 'text',
          WebkitTextFillColor: 'transparent',
          fontWeight: 600,
        }}>volafly.net</span>
      </div>

      {/* CTA button */}
      <div style={{
        padding: '24px 48px',
        background: '#0A84FF',
        borderRadius: 14,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 30,
        fontWeight: 600,
        color: '#fff',
        letterSpacing: '-0.01em',
        opacity: btnOpacity,
        transform: `scale(${btnScale})`,
        boxShadow: `0 20px 60px rgba(10,132,255,${0.25 + 0.15 * pulse}), 0 0 0 1px rgba(255,255,255,0.08) inset`,
        display: 'inline-flex', alignItems: 'center', gap: 14,
      }}>
        Kostenlos starten
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </div>

      {/* Small print */}
      <div style={{
        marginTop: 40,
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: 16,
        color: 'rgba(255,255,255,0.3)',
        letterSpacing: '0.04em',
        opacity: subT,
      }}>
        Kostenlos · Kein Abo · Keine Anlageberatung
      </div>
    </div>
  );
}

window.SceneCTA = SceneCTA;

  </script>

  <!-- ── Main: Video composition + mount ── -->
  <script type="text/babel" data-presets="env,react">
// ── Subtle background — a gentle, slow-moving vola wave behind everything ──
function BackgroundWave() {
  const time = useTime();
  const amp = 24;
  const phase = time * 0.35;
  const path = [];
  for (let x = 0; x <= 1920; x += 40) {
    const y = 540 + Math.sin((x / 1920) * Math.PI * 3 + phase) * amp
                   + Math.sin((x / 1920) * Math.PI * 7 + phase * 1.3) * amp * 0.4;
    path.push((x === 0 ? 'M' : 'L') + ' ' + x + ' ' + y);
  }
  return (
    <svg width="1920" height="1080" style={{
      position: 'absolute', inset: 0,
      pointerEvents: 'none',
      opacity: 0.04,
    }}>
      <defs>
        <linearGradient id="bgwave" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#0A84FF" />
          <stop offset="100%" stopColor="#BF5AF2" />
        </linearGradient>
      </defs>
      <path d={path.join(' ')} stroke="url(#bgwave)" strokeWidth="2" fill="none" />
      <path d={path.join(' ').replace(/540/g, '580')}
            stroke="url(#bgwave)" strokeWidth="2" fill="none" opacity="0.5" />
    </svg>
  );
}

function ChapterLabel({ start, end, num, label }) {
  return (
    <Sprite start={start} end={end}>
      <ChapterInner num={num} label={label} />
    </Sprite>
  );
}
function ChapterInner({ num, label }) {
  const { localTime, duration } = useSprite();
  const inT  = Math.min(1, localTime / 0.4);
  const outT = localTime > duration - 0.4 ? (localTime - (duration - 0.4)) / 0.4 : 0;
  const opacity = Math.min(inT, 1 - outT);
  return (
    <div style={{
      position: 'absolute',
      left: 64, bottom: 60,
      display: 'flex', alignItems: 'center', gap: 14,
      opacity,
    }}>
      <div style={{ width: 36, height: 1, background: 'rgba(255,255,255,0.3)' }} />
      <span style={{
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 13, fontWeight: 500,
        color: 'rgba(255,255,255,0.35)',
        letterSpacing: '0.1em',
      }}>
        {num} · {label}
      </span>
    </div>
  );
}

function Video() {
  return (
    <Stage
      width={1920}
      height={1080}
      duration={38}
      background="#0A0A0A"
      persistKey="volafly-launch-video"
      loop={true}
    >
      <BackgroundWave />
      <SceneNoise        start={0}    end={4.2}  />
      <SceneLogo         start={4.2}  end={8.5}  />
      <SceneSources      start={8.5}  end={14.5} />
      <SceneClasses      start={14.5} end={22}   />
      <SceneAnticyclical start={22}   end={30}   />
      <SceneCTA          start={30}   end={38}   />
      <ChapterLabel start={0}    end={4.2}  num="01" label="Das Problem" />
      <ChapterLabel start={4.2}  end={8.5}  num="02" label="Volafly" />
      <ChapterLabel start={8.5}  end={14.5} num="03" label="Drei Datenquellen" />
      <ChapterLabel start={14.5} end={22}   num="04" label="Fünf Stufen" />
      <ChapterLabel start={22}   end={30}   num="05" label="Antizyklisch" />
      <ChapterLabel start={30}   end={38}   num="06" label="volafly.net" />
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Video />);
  </script>
</body>
